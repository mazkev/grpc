syntax = "proto3";

package hello;

option go_package = "grpc-learning/gen/hello;hellopb";

// Request dari client: hanya membawa 1 string nama
message HelloRequest {
  string name = 1;
}

// Response dari server: hanya membawa 1 string pesan
message HelloResponse {
  string message = 1;
}

// Request untuk operasi matematika penjumlahan
message AddRequest {
  int32 a = 1;
  int32 b = 2;
}

// Response hasil penjumlahan
message AddResponse {
  int32 result = 1;
}

// Request untuk operasi pembagian (menggunakan tipe desimal double)
message DivideRequest {
  double a = 1;
  double b = 2;
}

// Response hasil pembagian
message DivideResponse {
  double result = 1;
}

// Request untuk menjumlahkan deretan angka (array/slice di Protobuf pakai 'repeated')
message SumAllRequest {
  repeated int32 numbers = 1;
}

// Response hasil penjumlahan deretan angka
message SumAllResponse {
  int32 total = 1;
  int32 count = 2; // Berapa banyak angka yang dijumlahkan
}

// Service: mendefinisikan fungsi yang bisa dipanggil
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloResponse);
  rpc SayGoodbye (HelloRequest) returns (HelloResponse);
  
  // Fungsi matematika: menerima 2 angka, mengembalikan hasil jumlah
  rpc Add (AddRequest) returns (AddResponse);

  // Fungsi pembagian: memvalidasi agar b tidak boleh nol
  rpc Divide (DivideRequest) returns (DivideResponse);

  // Fungsi penjumlahan array: menjumlahkan banyak angka dari slice
  rpc SumAll (SumAllRequest) returns (SumAllResponse);
}




