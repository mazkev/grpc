name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "belajar-mandiri" ]
  pull_request:
    branches: [ "main", "belajar-mandiri" ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: Continuous Integration (CI)
  # ==========================================
  test:
    name: Run Automated Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: 2. Setup Lingkungan Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 3. Unduh Dependensi
        run: go mod download

      - name: 4. Static Code Analysis (Vet)
        run: go vet ./...

      - name: 5. Eksekusi Unit Tests
        run: go test -v ./...

  # ==========================================
  # STAGE 2: Continuous Delivery (CD)
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test  # Quality Gate: Hanya jalan jika stage test lolos!
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # Hanya upload image saat push ke branch

    steps:
      - name: 1. Checkout Kode Sumber
        uses: actions/checkout@v4

      - name: 2. Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login ke GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Buat Metadata dan Tag Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/grpc-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 5. Build dan Push Image ke Cloud Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
