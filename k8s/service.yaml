apiVersion: v1
kind: Service
metadata:
  name: grpc-server-service
  labels:
    app: grpc-server
spec:
  type: LoadBalancer  # Membuka pintu gerbang ke localhost laptop kamu!
  selector:
    app: grpc-server  # Otomatis mengarahkan traffic ke semua Pod berlabel 'app: grpc-server'
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 2112
      targetPort: 2112
