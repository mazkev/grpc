syntax = "proto3";

package payment;

// Menentukan letak kode Go hasil generate
option go_package = "grpc-learning/gen/payment;paymentpb";

// 1. Permintaan Pembayaran dari Order Service ke Payment Service
message PaymentRequest {
  string order_id = 1; // Contoh: "ORD-101"
  string user_id = 2;  // Contoh: "USER-99"
  double amount = 3;   // Contoh: 150000.0 (Rp 150.000)
}

// 2. Balasan dari Payment Service ke Order Service
message PaymentResponse {
  string payment_id = 1; // Contoh: "PAY-9999"
  bool success = 2;       // true jika sukses, false jika gagal (misal saldo kurang)
  string message = 3;     // Keterangan status
}

// 3. Service yang dipublikasikan oleh Payment Service
service PaymentService {
  rpc ProcessPayment(PaymentRequest) returns (PaymentResponse);
}
