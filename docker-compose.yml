services:
  # ==========================================
  # 1. High-Performance In-Memory Cache (Redis)
  # ==========================================
  redis:
    image: redis:alpine
    container_name: redis-server
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-net

  # ==========================================
  # 2. Asynchronous Message Broker (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-server
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI (guest:guest)
    networks:
      - app-net

  # ==========================================
  # 3. Distributed Event Streaming Log (Kafka KRaft)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka-server
    restart: unless-stopped
    ports:
      - "9092:9092"    # Client external listener (Go App dari host)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-server:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-server:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - app-net

  # ==========================================
  # 4. Web GUI for Apache Kafka
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"    # Kafka UI Web Interface
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-server:29092
    depends_on:
      - kafka
    networks:
      - app-net

  # ==========================================
  # 5. Metrics Collection & Time Series (Prometheus)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-server
    restart: unless-stopped
    ports:
      - "9090:9090"    # Prometheus Web & API
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  # ==========================================
  # 6. Observability & Visualization (Grafana)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-server
    restart: unless-stopped
    ports:
      - "3000:3000"    # Grafana Dashboard (admin:admin)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app-net

  # ==========================================
  # 7. Core gRPC Microservice Server (Go App)
  # ==========================================
  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: grpc-server:v1
    container_name: grpc-server
    restart: unless-stopped
    ports:
      - "50051:50051"  # Port gRPC Server
      - "2112:2112"    # Port Metrik Prometheus
    environment:
      REDIS_HOST: "redis-server:6379"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq-server:5672/"
      KAFKA_BROKER: "kafka-server:29092"
    depends_on:
      - redis
      - rabbitmq
      - kafka
    networks:
      - app-net

networks:
  app-net:
    external: true
