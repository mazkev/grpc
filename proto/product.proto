syntax = "proto3";

package product;

// 1. Lokasi di mana kode Go hasil generate akan diletakkan nanti
option go_package = "grpc-learning/gen/product;productpb";

// 2. Definisi Model Data Produk
message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

// 3. Format Request: apa yang wajib dikirim client saat ingin mencari produk
message GetProductRequest {
  string id = 1;
}

// 4. Format Response: apa yang dijanjikan server untuk dikembalikan
message GetProductResponse {
  Product product = 1;
}


// Pesan dari client
message ChatMessage {
  string sender = 1;
  string text = 2;
}

// Balasan dari server
message ChatResponse {
  string reply = 1;
}

service ProductService {
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);

  // Fitur Streaming Dua Arah:
  rpc LiveChat (stream ChatMessage) returns (stream ChatResponse);
}
